name: Deploy TeamRegister

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Stop existing processes
        run: |
          Get-CimInstance Win32_Process -Filter "Name='node.exe'" |
            Where-Object { $_.CommandLine -match 'server\.js|ng\s+serve' } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Write-Host "Stopped existing node processes."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Start backend
        run: |
          $backendDir = Join-Path $env:GITHUB_WORKSPACE "backend"
          $backendLog = Join-Path $env:GITHUB_WORKSPACE "backend.log"
          $cmd = "`$env:PORT='3000'; Set-Location '$backendDir'; node server.js *>> '$backendLog'"
          Start-Process -FilePath "pwsh" -ArgumentList "-WindowStyle", "Hidden", "-Command", $cmd

      - name: Wait for backend to be ready
        run: |
          Write-Host "Waiting for backend to start..."
          for ($i = 1; $i -le 15; $i++) {
            try {
              Invoke-WebRequest -Uri "http://localhost:3000" -UseBasicParsing -ErrorAction Stop | Out-Null
              Write-Host "Backend is up."
              exit 0
            } catch {}
            Start-Sleep -Seconds 2
          }
          Write-Error "Backend did not become ready in time."
          exit 1

      - name: Start frontend
        run: |
          $frontendDir = Join-Path $env:GITHUB_WORKSPACE "frontend"
          $frontendLog = Join-Path $env:GITHUB_WORKSPACE "frontend.log"
          $cmd = "Set-Location '$frontendDir'; npx ng serve --proxy-config proxy.conf.json --host 0.0.0.0 *>> '$frontendLog'"
          Start-Process -FilePath "pwsh" -ArgumentList "-WindowStyle", "Hidden", "-Command", $cmd

      - name: Wait for frontend to be ready
        run: |
          Write-Host "Waiting for frontend to start..."
          for ($i = 1; $i -le 30; $i++) {
            try {
              Invoke-WebRequest -Uri "http://localhost:4200" -UseBasicParsing -ErrorAction Stop | Out-Null
              Write-Host "Frontend is up."
              exit 0
            } catch {}
            Start-Sleep -Seconds 3
          }
          Write-Error "Frontend did not become ready in time."
          exit 1

      - name: Deployment complete
        run: Write-Host "Backend and frontend are running."
