name: Deploy TeamRegister

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Stop existing processes
        run: |
          foreach ($task in @("TeamRegisterBackend", "TeamRegisterFrontend")) {
            Stop-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue
            Unregister-ScheduledTask -TaskName $task -Confirm:$false -ErrorAction SilentlyContinue
          }
          Get-CimInstance Win32_Process -Filter "Name='node.exe'" |
            Where-Object { $_.CommandLine -match 'server\.js|ng\s+serve' } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Write-Host "Stopped existing processes and scheduled tasks."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Start backend
        run: |
          $backendDir = Join-Path $env:GITHUB_WORKSPACE "backend"
          $backendLog = Join-Path $env:GITHUB_WORKSPACE "backend.log"
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE "run-backend.ps1"
          @(
            "`$env:PORT = '3000'",
            "Set-Location -LiteralPath '$backendDir'",
            "node server.js *>> '$backendLog' 2>&1"
          ) -join "`n" | Set-Content -Path $scriptPath -Encoding UTF8
          $action = New-ScheduledTaskAction -Execute "pwsh.exe" `
            -Argument "-NonInteractive -WindowStyle Hidden -File `"$scriptPath`""
          $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Hours 8)
          Register-ScheduledTask -TaskName "TeamRegisterBackend" -Action $action `
            -Settings $settings -RunLevel Highest -Force | Out-Null
          Start-ScheduledTask -TaskName "TeamRegisterBackend"
          Write-Host "Backend scheduled task started."

      - name: Wait for backend to be ready
        run: |
          Write-Host "Waiting for backend to start..."
          for ($i = 1; $i -le 15; $i++) {
            try {
              $resp = Invoke-WebRequest -Uri "http://localhost:3000/health" -UseBasicParsing -ErrorAction Stop
              if ($resp.StatusCode -eq 200) {
                Write-Host "Backend is up."
                exit 0
              }
            } catch {}
            Start-Sleep -Seconds 2
          }
          Write-Error "Backend did not become ready in time."
          exit 1

      - name: Output backend log on failure
        if: failure()
        run: |
          $backendLog = Join-Path $env:GITHUB_WORKSPACE "backend.log"
          if (Test-Path $backendLog) {
            Write-Host "=== backend.log ==="
            Get-Content $backendLog
          } else {
            Write-Host "No backend.log found."
          }

      - name: Start frontend
        run: |
          $frontendDir = Join-Path $env:GITHUB_WORKSPACE "frontend"
          $frontendLog = Join-Path $env:GITHUB_WORKSPACE "frontend.log"
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE "run-frontend.ps1"
          @(
            "Set-Location -LiteralPath '$frontendDir'",
            "npx ng serve --proxy-config proxy.conf.json --host 0.0.0.0 *>> '$frontendLog' 2>&1"
          ) -join "`n" | Set-Content -Path $scriptPath -Encoding UTF8
          $action = New-ScheduledTaskAction -Execute "pwsh.exe" `
            -Argument "-NonInteractive -WindowStyle Hidden -File `"$scriptPath`""
          $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Hours 8)
          Register-ScheduledTask -TaskName "TeamRegisterFrontend" -Action $action `
            -Settings $settings -RunLevel Highest -Force | Out-Null
          Start-ScheduledTask -TaskName "TeamRegisterFrontend"
          Write-Host "Frontend scheduled task started."

      - name: Wait for frontend to be ready
        run: |
          Write-Host "Waiting for frontend to start..."
          for ($i = 1; $i -le 30; $i++) {
            try {
              Invoke-WebRequest -Uri "http://localhost:4200" -UseBasicParsing -ErrorAction Stop | Out-Null
              Write-Host "Frontend is up."
              exit 0
            } catch {}
            Start-Sleep -Seconds 3
          }
          Write-Error "Frontend did not become ready in time."
          exit 1

      - name: Deployment complete
        run: Write-Host "Backend and frontend are running."
